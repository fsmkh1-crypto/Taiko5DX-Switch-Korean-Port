name: Document governance

on:
  push:
    paths:
      - '**/*.md'
      - 'docs/DOCUMENT_AUTHORITY_INDEX.json'
      - 'tools/validate_document_governance.py'
      - '.github/workflows/document-governance.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/DOCUMENT_AUTHORITY_INDEX.json'
      - 'tools/validate_document_governance.py'
      - '.github/workflows/document-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/validate_document_governance.py
      - run: python tools/validate_document_governance.py --repo-root .
