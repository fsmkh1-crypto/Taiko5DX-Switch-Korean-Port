name: Machine accounting schema v1 candidate

on:
  push:
    paths:
      - 'docs/MACHINE_READABLE_ACCOUNTING_SCHEMA.md'
      - 'docs/CLAIM_EXTRACTION_RULES.md'
      - 'docs/manifests/F1_STATIC_WRITE_AUTHORIZATION_MANIFEST.jsonl.gz'
      - 'docs/manifests/F1_STATIC_WRITE_AUTHORIZATION_MANIFEST/**'
      - 'data/pilot/f1/**'
      - 'data/pilot/f1_v1_candidate/**'
      - 'tools/machine_accounting_v1_candidate_lib.py'
      - 'tools/validate_machine_accounting_schema_v1_candidate.py'
      - 'tools/validate_machine_accounting_schema_v1_candidate_v094_transport.py'
      - 'tools/diagnose_f1_manifest_transport.py'
      - 'tests/fixtures/machine_accounting_schema_v1.json'
      - '.github/workflows/machine-accounting-schema-v1-candidate.yml'
  pull_request:
    paths:
      - 'docs/MACHINE_READABLE_ACCOUNTING_SCHEMA.md'
      - 'docs/CLAIM_EXTRACTION_RULES.md'
      - 'docs/manifests/F1_STATIC_WRITE_AUTHORIZATION_MANIFEST.jsonl.gz'
      - 'docs/manifests/F1_STATIC_WRITE_AUTHORIZATION_MANIFEST/**'
      - 'data/pilot/f1/**'
      - 'data/pilot/f1_v1_candidate/**'
      - 'tools/machine_accounting_v1_candidate_lib.py'
      - 'tools/validate_machine_accounting_schema_v1_candidate.py'
      - 'tools/validate_machine_accounting_schema_v1_candidate_v094_transport.py'
      - 'tools/diagnose_f1_manifest_transport.py'
      - 'tests/fixtures/machine_accounting_schema_v1.json'
      - '.github/workflows/machine-accounting-schema-v1-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validators
        run: >-
          python -m py_compile
          tools/machine_accounting_v1_candidate_lib.py
          tools/validate_machine_accounting_schema_v1_candidate.py
          tools/validate_machine_accounting_schema_v1_candidate_v094_transport.py
          tools/diagnose_f1_manifest_transport.py
      - name: Diagnose bound V094 transport
        run: python tools/diagnose_f1_manifest_transport.py
      - name: Release fail-fast validation
        run: python tools/validate_machine_accounting_schema_v1_candidate.py --repo-root .
      - name: Collect-all machine-gate diagnostic
        run: python tools/validate_machine_accounting_schema_v1_candidate_v094_transport.py --repo-root .
